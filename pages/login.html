<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Patas &amp; Pelos Pet Shop</title>
  <meta name="description" content="Entre na sua conta para acompanhar pedidos e finalizar compras.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B2B4C'/%3E%3Cg fill='%23F2A007'%3E%3Cellipse cx='32' cy='40' rx='9' ry='7'/%3E%3Ccircle cx='20' cy='30' r='4.5'/%3E%3Ccircle cx='27' cy='23' r='4.5'/%3E%3Ccircle cx='37' cy='23' r='4.5'/%3E%3Ccircle cx='44' cy='30' r='4.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login" data-base="../" data-nav="">
<main id="conteudo">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Bem-vindo de volta!</h1>
        <p>Entre para acompanhar pedidos e finalizar compras.</p>
        <form id="loginForm" novalidate>
          <div class="field"><label for="lEmail">E-mail</label><input class="input" type="email" id="lEmail" placeholder="voce@email.com" autocomplete="email"><span class="err"></span></div>
          <div class="field"><label for="lSenha">Senha</label><div class="pass-wrap"><input class="input" type="password" id="lSenha" placeholder="Sua senha" autocomplete="current-password"><button type="button" class="pass-eye" data-for="lSenha" aria-label="Mostrar senha"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></button></div><span class="err"></span></div>
          <div class="form-foot"><label class="check"><input type="checkbox" id="lRemember" checked> Lembrar-me</label><button type="button" class="form-link" id="btnForgot" style="color:var(--blue-d)">Esqueci minha senha</button></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Entrar</button>
        </form>
        <div class="demo-box"><p>Quer só dar uma olhada? Use a conta de demonstração.</p><button class="btn btn-dark btn-sm" id="btnDemo" type="button">Entrar com conta demo</button></div>
        <p class="auth-alt">Ainda não tem conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
      </div>
    </div>
  </div>
</main>
<script src="../js/products.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/favorites.js"></script>
<script src="../js/search.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/product.js"></script>
<script src="../js/category.js"></script>
<script src="../js/main.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
