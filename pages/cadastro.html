<body data-page="cadastro" data-base="../" data-nav="">
<main id="conteudo"><div class="container"><div class="auth-wrap"><div class="auth-card">
<h1>Crie sua conta</h1><p>Grátis e rápido — ganhe <strong>10% OFF</strong> na primeira compra.</p>
<form id="regForm" novalidate>
<div class="field"><label for="rNome">Nome completo</label><input class="input" type="text" id="rNome" placeholder="Seu nome" autocomplete="name"><span class="err"></span></div>
<div class="field"><label for="rEmail">E-mail</label><input class="input" type="email" id="rEmail" placeholder="voce@email.com" autocomplete="email"><span class="err"></span></div>
<div class="field"><label for="rTel">Telefone / WhatsApp</label><input class="input" type="tel" id="rTel" placeholder="(31) 99999-0000" autocomplete="tel"><span class="err"></span></div>
<div class="field"><label for="rSenha">Senha</label><div class="pass-wrap"><input class="input" type="password" id="rSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password"><button type="button" class="pass-eye" data-for="rSenha" aria-label="Mostrar senha"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></button></div><span class="err"></span></div>
<div class="field"><label for="rSenha2">Confirmar senha</label><div class="pass-wrap"><input class="input" type="password" id="rSenha2" placeholder="Repita a senha" autocomplete="new-password"><button type="button" class="pass-eye" data-for="rSenha2" aria-label="Mostrar senha"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></button></div><span class="err"></span></div>
<button class="btn btn-primary btn-block btn-lg" type="submit">Criar conta</button></form>
<p class="auth-alt">Já tem conta? <a href="login.html">Entre aqui</a></p>
</div></div></div></main>
